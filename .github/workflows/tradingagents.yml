name: TradingAgents Engine + Controller
run-name: ${{ github.event_name == 'repository_dispatch' && format('Engine · {0}', github.event.client_payload.request_id) || 'Telegram Controller' }}

on:
  workflow_dispatch:
  repository_dispatch:
    types: [tradingagents_run]

permissions:
  contents: read
  actions: read

env:
  # TradingAgents Core Configs
  TRADINGAGENTS_OUTPUT_LANGUAGE: ${{ secrets.TRADINGAGENTS_OUTPUT_LANGUAGE || 'English' }}
  TRADINGAGENTS_CHECKPOINT_ENABLED: ${{ secrets.TRADINGAGENTS_CHECKPOINT_ENABLED || 'true' }}
  TRADINGAGENTS_DEFAULT_ANALYSTS: ${{ secrets.TRADINGAGENTS_DEFAULT_ANALYSTS || 'market,social,news,fundamentals' }}
  TRADINGAGENTS_MAX_DEBATE_ROUNDS: ${{ secrets.TRADINGAGENTS_MAX_DEBATE_ROUNDS || '1' }}
  TRADINGAGENTS_MAX_RISK_ROUNDS: ${{ secrets.TRADINGAGENTS_MAX_RISK_ROUNDS || '1' }}
  TRADINGAGENTS_MAX_TOOL_ROUNDS: ${{ secrets.TRADINGAGENTS_MAX_TOOL_ROUNDS || '20' }}
  TRADINGAGENTS_LLM_MAX_RETRIES: ${{ secrets.TRADINGAGENTS_LLM_MAX_RETRIES || '6' }}
  TRADINGAGENTS_MAX_TOKENS: ${{ secrets.TRADINGAGENTS_MAX_TOKENS || '8192' }}
  TRADINGAGENTS_TEMPERATURE: ${{ secrets.TRADINGAGENTS_TEMPERATURE || '0.0' }}
  
  # Dynamic Model Configs (Injected by Bot)
  TRADINGAGENTS_LLM_PROVIDER: ${{ secrets.TRADINGAGENTS_LLM_PROVIDER }}
  TRADINGAGENTS_DEEP_THINK_LLM: ${{ secrets.TRADINGAGENTS_DEEP_THINK_LLM }}
  TRADINGAGENTS_QUICK_THINK_LLM: ${{ secrets.TRADINGAGENTS_QUICK_THINK_LLM }}
  TRADINGAGENTS_LLM_BACKEND_URL: ${{ secrets.TRADINGAGENTS_LLM_BACKEND_URL }}

  # Provider API Keys
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
  AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
  XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
  DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
  DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
  ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
  MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
  MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
  OPENAI_COMPATIBLE_API_KEY: ${{ secrets.OPENAI_COMPATIBLE_API_KEY }}
  AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}

jobs:
  controller:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    concurrency:
      group: tradingagents-controller-${{ github.repository }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - name: Restore Bot State
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .runtime
          artifact_id="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq '[.artifacts[] | select(.name=="bot-state" and .expired==false)] | sort_by(.created_at) | reverse | .[0].id // empty')"
          if [[ -n "${artifact_id:-}" ]]; then
            gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > .runtime/state.zip
            unzip -o .runtime/state.zip -d .runtime >/dev/null && rm -f .runtime/state.zip
          fi
      - name: Install Dependencies
        run: python -m pip install --disable-pip-version-check PyNaCl
      - name: Run Telegram Controller
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          BOT_GITHUB_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}
          BOT_STATE_KEY: ${{ secrets.BOT_STATE_KEY }}
          TELEGRAM_ADMIN_IDS: ${{ secrets.TELEGRAM_ADMIN_IDS }}
          TELEGRAM_ALLOWED_USER_IDS: ${{ secrets.TELEGRAM_ALLOWED_USER_IDS }}
          BOT_STATE_PATH: ${{ github.workspace }}/.runtime/bot_state.db
          GITHUB_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO: ${{ github.event.repository.name }}
        run: python bot.py
      - name: Save Bot State
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-state
          path: .runtime/bot_state.db
          retention-days: 90

  engine:
    if: ${{ github.event_name == 'repository_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    concurrency:
      group: tradingagents-engine-${{ github.event.client_payload.request_id }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install TradingAgents
        run: python -m pip install -e .
      - name: Restore Engine Cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .runtime/cache
          artifact_id="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq '[.artifacts[] | select(.name=="engine-cache" and .expired==false)] | sort_by(.created_at) | reverse | .[0].id // empty')"
          if [[ -n "${artifact_id:-}" ]]; then
            gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > .runtime/cache.zip
            unzip -o .runtime/cache.zip -d .runtime/cache >/dev/null && rm -f .runtime/cache.zip
          fi
      - name: Parse Request & Run Engine
        env:
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: |
          python -c '
          import json, os, sys, subprocess
          p = json.loads(os.environ["PAYLOAD"])
          mode = p.get("mode")
          params = p.get("params", {})
          
          cmd = ["tradingagents"]
          if mode == "analysis":
              cmd += ["--ticker", params["ticker"], "--date", params["date"], "--analysts", params.get("analysts", "market,news,fundamentals"), "--save", "--no-show"]
          elif mode == "backtest":
              cmd += ["backtest", params["tickers"], "--start", params["start"], "--end", params["end"], "--every", str(params.get("every", 7)), "--analysts", params.get("analysts", "market,news,fundamentals")]
          
          print(f"Executing: {\" \".join(cmd)}")
          sys.exit(subprocess.call(cmd))
          '
      - name: Save Engine Cache
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-cache
          path: .runtime/cache/
          retention-days: 90
      - name: Upload Run Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-results-${{ github.run_id }}
          path: .runtime/
          retention-days: 90