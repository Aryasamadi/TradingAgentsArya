name: TradingAgents Engine

on:
  workflow_dispatch:
    inputs:
      ticker:
        description: "Ticker"
        required: true
        type: string
      date:
        description: "Analysis date (YYYY-MM-DD)"
        required: true
        type: string
      analysts:
        description: "Analysts (comma-separated). Leave empty to use the agent default."
        required: false
        default: ""
        type: string
      request_id:
        description: "Unique request ID"
        required: false
        default: ""
        type: string
      run_id:
        description: "Optional previous run ID for resume/backtest workflows"
        required: false
        default: ""
        type: string
      portfolio:
        description: "Optional portfolio JSON path"
        required: false
        default: ""
        type: string
      mode:
        description: "Execution mode"
        required: false
        default: "analysis"
        type: choice
        options:
          - analysis
          - backtest

permissions:
  contents: read
  actions: read

concurrency:
  group: tradingagents-engine-${{ github.event.inputs.request_id || github.run_id }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install TradingAgents
        run: python -m pip install -e .

      - name: Prepare runtime directories
        run: |
          mkdir -p .runtime/run
          mkdir -p .runtime/results
          mkdir -p .runtime/cache

      - name: Run TradingAgents
        env:
          TICKER: ${{ inputs.ticker }}
          ANALYSIS_DATE: ${{ inputs.date }}
          ANALYSTS: ${{ inputs.analysts }}
          REQUEST_ID: ${{ inputs.request_id }}
          MODE: ${{ inputs.mode }}
          RUN_ID: ${{ inputs.run_id }}
          PORTFOLIO: ${{ inputs.portfolio }}
          TRADINGAGENTS_RESULTS_DIR: ${{ github.workspace }}/.runtime/results
          TRADINGAGENTS_CACHE_DIR: ${{ github.workspace }}/.runtime/cache
        run: |
          set -euo pipefail

          if [[ "$MODE" != "analysis" ]]; then
            echo "Error: mode '$MODE' is not implemented by this engine workflow yet." >&2
            exit 2
          fi

          if [[ -z "$ANALYSTS" ]]; then
            CMD=(tradingagents --ticker "$TICKER" --date "$ANALYSIS_DATE" --save --no-show)
          else
            CMD=(tradingagents --ticker "$TICKER" --date "$ANALYSIS_DATE" --analysts "$ANALYSTS" --save --no-show)
          fi

          printf '%s\n' "request_id=$REQUEST_ID" "ticker=$TICKER" "date=$ANALYSIS_DATE" "analysts=${ANALYSTS:-<agent-default>}" > .runtime/run/request.txt
          "${CMD[@]}" 2>&1 | tee .runtime/run/agent.log

      - name: Write run metadata
        if: always()
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          TICKER: ${{ inputs.ticker }}
          ANALYSIS_DATE: ${{ inputs.date }}
          ANALYSTS: ${{ inputs.analysts }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          Path(".runtime/run/run.json").write_text(
              json.dumps(
                  {
                      "github_run_id": os.environ.get("GITHUB_RUN_ID"),
                      "request_id": os.environ.get("REQUEST_ID", ""),
                      "ticker": os.environ.get("TICKER", ""),
                      "date": os.environ.get("ANALYSIS_DATE", ""),
                      "analysts": os.environ.get("ANALYSTS", ""),
                  },
                  ensure_ascii=False,
                  indent=2,
              ),
              encoding="utf-8",
          )
          PY

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tradingagents-run-${{ github.run_id }}
          path: .runtime/run/
          retention-days: 90
          if-no-files-found: warn

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tradingagents-results-${{ github.run_id }}
          path: .runtime/results/
          retention-days: 90
          if-no-files-found: warn
