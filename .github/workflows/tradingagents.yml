name: TradingAgents Engine + Telegram Controller (phase 1 UI)

run-name: >-
  ${{ github.event_name == 'repository_dispatch'
      && format('Engine · {0}', github.event.client_payload.request_id)
      || 'Telegram Controller' }}

on:
  workflow_dispatch:
  repository_dispatch:
    types: [tradingagents_run]

permissions:
  contents: read
  actions: write

env:
  TRADINGAGENTS_OUTPUT_LANGUAGE: ${{ secrets.TRADINGAGENTS_OUTPUT_LANGUAGE || 'Persian' }}
  TRADINGAGENTS_CHECKPOINT_ENABLED: ${{ secrets.TRADINGAGENTS_CHECKPOINT_ENABLED || 'true' }}
  TRADINGAGENTS_DEFAULT_ANALYSTS: ${{ secrets.TRADINGAGENTS_DEFAULT_ANALYSTS || 'market,social,news,fundamentals' }}
  TRADINGAGENTS_MAX_DEBATE_ROUNDS: ${{ secrets.TRADINGAGENTS_MAX_DEBATE_ROUNDS || '1' }}
  TRADINGAGENTS_MAX_RISK_ROUNDS: ${{ secrets.TRADINGAGENTS_MAX_RISK_ROUNDS || '1' }}
  TRADINGAGENTS_MAX_TOOL_ROUNDS: ${{ secrets.TRADINGAGENTS_MAX_TOOL_ROUNDS || '20' }}
  # Provider SDK retries are disabled; the engine applies RPM-only fixed-delay retries.\n  TRADINGAGENTS_LLM_MAX_RETRIES: '0'\n  TRADINGAGENTS_RPM_RETRIES: '3'
  TRADINGAGENTS_MAX_TOKENS: ${{ secrets.TRADINGAGENTS_MAX_TOKENS || '8192' }}
  TRADINGAGENTS_TEMPERATURE: ${{ secrets.TRADINGAGENTS_TEMPERATURE || '0.0' }}
  TRADINGAGENTS_GOOGLE_THINKING_LEVEL: ${{ secrets.TRADINGAGENTS_GOOGLE_THINKING_LEVEL || 'medium' }}
  TRADINGAGENTS_OPENAI_REASONING_EFFORT: ${{ secrets.TRADINGAGENTS_OPENAI_REASONING_EFFORT || 'medium' }}
  TRADINGAGENTS_ANTHROPIC_EFFORT: ${{ secrets.TRADINGAGENTS_ANTHROPIC_EFFORT || 'high' }}

  TRADINGAGENTS_LLM_PROVIDER: ${{ secrets.TRADINGAGENTS_LLM_PROVIDER }}
  TRADINGAGENTS_DEEP_THINK_LLM: ${{ secrets.TRADINGAGENTS_DEEP_THINK_LLM }}
  TRADINGAGENTS_QUICK_THINK_LLM: ${{ secrets.TRADINGAGENTS_QUICK_THINK_LLM }}
  TRADINGAGENTS_LLM_BACKEND_URL: ${{ secrets.TRADINGAGENTS_LLM_BACKEND_URL }}

  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
  GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
  DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
  DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
  DASHSCOPE_CN_API_KEY: ${{ secrets.DASHSCOPE_CN_API_KEY }}
  ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
  ZHIPU_CN_API_KEY: ${{ secrets.ZHIPU_CN_API_KEY }}
  MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
  MINIMAX_CN_API_KEY: ${{ secrets.MINIMAX_CN_API_KEY }}
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
  MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
  OPENAI_COMPATIBLE_API_KEY: ${{ secrets.OPENAI_COMPATIBLE_API_KEY }}

  AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
  AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
  AWS_PROFILE: ${{ secrets.AWS_PROFILE }}

  OLLAMA_BASE_URL: ${{ secrets.OLLAMA_BASE_URL }}
  TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
  TYPESAFE_DEFAULT_MODEL: ${{ secrets.TYPESAFE_DEFAULT_MODEL }}
  FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
  ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
  SEC_EDGAR_USER_AGENT: ${{ secrets.SEC_EDGAR_USER_AGENT }}

jobs:
  controller:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    concurrency:
      group: tradingagents-telegram-controller-${{ github.repository }}
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Restore controller state
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          BOT_STATE_PATH: ${{ github.workspace }}/.runtime/controller/bot_state.db
        run: |
          set -euo pipefail
          mkdir -p .runtime/controller
          # The newest artifact is not always the newest usable one: a
          # controller that crashed early can publish an empty state. The
          # script walks the artifacts from newest to oldest and takes the
          # first one that is a real state database.
          python scripts/restore_state.py --repo "${GITHUB_REPOSITORY}" --destination "${BOT_STATE_PATH}"

      - name: Install controller dependency
        run: python -m pip install --disable-pip-version-check PyNaCl

      - name: Start Telegram controller
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          BOT_GITHUB_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}
          BOT_STATE_KEY: ${{ secrets.BOT_STATE_KEY }}
          TELEGRAM_ADMIN_IDS: ${{ secrets.TELEGRAM_ADMIN_IDS }}
          TELEGRAM_ALLOWED_USER_IDS: ${{ secrets.TELEGRAM_ALLOWED_USER_IDS }}
          BOT_STATE_PATH: ${{ github.workspace }}/.runtime/controller/bot_state.db
          GITHUB_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO: ${{ github.event.repository.name }}
          GITHUB_REF: ${{ github.event.repository.default_branch }}
        run: python bot.py

      - name: Save controller state
        if: always()
        env:
          BOT_STATE_PATH: ${{ github.workspace }}/.runtime/controller/bot_state.db
        run: |
          set -euo pipefail
          # The state is only published when it is a usable database. A
          # controller that crashed before it could read the state must not
          # replace the durable state with an empty file.
          python scripts/restore_state.py --check "${BOT_STATE_PATH}"

      - name: Upload controller state
        if: always() && steps.save-controller-state.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: tradingagents-controller-state
          path: ${{ github.workspace }}/.runtime/controller/bot_state.db
          retention-days: 90
          if-no-files-found: warn

  engine:
    if: ${{ github.event_name == 'repository_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    concurrency:
      group: tradingagents-engine-${{ github.repository }}
      cancel-in-progress: false
      # Without an explicit queue the group keeps a single pending run, and a
      # new dispatch cancels the one that was waiting. queue: max lets several
      # analyses wait their turn instead of being killed.
      queue: max
    env:
      # Upstream writes its reports, its data cache and its trading memory
      # under ~/.tradingagents. The workflow persists .runtime/cache as an
      # artifact, so the engine is pointed at those directories; otherwise
      # the cache, the checkpoints and the memory log are lost between runs
      # and every run starts from scratch.
      TRADINGAGENTS_RESULTS_DIR: ${{ github.workspace }}/.runtime/tradingagents/logs
      TRADINGAGENTS_CACHE_DIR: ${{ github.workspace }}/.runtime/cache/data
      TRADINGAGENTS_MEMORY_LOG_PATH: ${{ github.workspace }}/.runtime/cache/memory/trading_memory.md
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install TradingAgents
        run: python -m pip install -e .

      - name: Install request crypto dependency
        run: python -m pip install --disable-pip-version-check PyNaCl

      - name: Prepare runtime
        run: |
          set -euo pipefail
          mkdir -p .runtime/run .runtime/results .runtime/cache .runtime/cache/memory

      - name: Restore TradingAgents state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          artifact_id="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '[.artifacts[] | select(.name=="tradingagents-state" and .expired==false)] | sort_by(.created_at) | reverse | .[0].id // empty')"

          if [[ -n "${artifact_id:-}" ]]; then
            gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > .runtime/state.zip
            unzip -o .runtime/state.zip -d .runtime/cache >/dev/null
            rm -f .runtime/state.zip
          fi

      - name: Read request
        env:
          REQUEST_JSON: ${{ toJSON(github.event.client_payload) }}
          BOT_STATE_KEY: ${{ secrets.BOT_STATE_KEY }}
          BOT_GITHUB_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}
          GITHUB_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import hashlib
          import json
          import os

          payload = json.loads(os.environ.get("REQUEST_JSON") or "{}")
          if not payload.get("request_id"):
              raise SystemExit("Missing request_id")

          mode = str(payload.get("mode") or "analysis")
          params = payload.get("params") or {}

          def clean(value):
              return str(value if value is not None else "").replace("\n", " ").replace("\r", " ")

          def write_env(key, value):
              with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
                  f.write(f"{key}={clean(value)}\n")

          write_env("REQUEST_ID", payload.get("request_id"))
          write_env("REQUEST_MODE", mode)
          write_env("REQUEST_CHAT_ID", payload.get("chat_id"))
          write_env("MODEL_ID", payload.get("model_id"))
          write_env("TICKER", params.get("ticker"))
          write_env("TICKERS", params.get("tickers"))
          write_env("ANALYSIS_DATE", params.get("date"))
          write_env("START_DATE", params.get("start"))
          write_env("END_DATE", params.get("end"))
          write_env("EVERY", params.get("every", "7"))
          write_env("ANALYSTS", params.get("analysts"))
          write_env("ASSET_TYPE", params.get("asset_type", "stock"))

          config_enc = str(payload.get("config_enc") or "")
          if config_enc:
              state_key = os.environ.get("BOT_STATE_KEY", "").strip()
              if not state_key:
                  # Match bot.py's automatic fallback exactly. BOT_GITHUB_TOKEN
                  # is already required by the Telegram controller, so no extra
                  # secret or user-managed encryption password is necessary.
                  gh_token = os.environ.get("BOT_GITHUB_TOKEN", "").strip()
                  owner = os.environ.get("GITHUB_OWNER", "").strip()
                  repo = os.environ.get("GITHUB_REPO", "").strip()
                  if not (gh_token and owner and repo):
                      raise SystemExit(
                          "Missing BOT_GITHUB_TOKEN/GITHUB_OWNER/GITHUB_REPO for automatic request decryption."
                      )
                  state_key = f"legacy:{owner}:{repo}:{gh_token}"
              try:
                  from nacl.secret import SecretBox

                  key = hashlib.sha256(state_key.encode("utf-8")).digest()
                  decrypted = SecretBox(key).decrypt(base64.b64decode(config_enc))
                  cfg = json.loads(decrypted.decode("utf-8"))

                  tiers = cfg.get("tiers")
                  if isinstance(tiers, dict):
                      for tier in ("quick", "deep"):
                          item = tiers.get(tier) or {}
                          prefix = tier.upper()
                          write_env(f"TRADINGAGENTS_{prefix}_THINK_PROVIDER", item.get("provider_type"))
                          write_env(f"TRADINGAGENTS_{prefix}_THINK_LLM", item.get("model_name"))
                          write_env(f"TRADINGAGENTS_{prefix}_THINK_BACKEND_URL", item.get("base_url"))
                          token = str(item.get("api_token") or "")
                          env_key = str(item.get("provider_env_key") or "")
                          if token:
                              print(f"::add-mask::{token}")
                              if env_key:
                                  write_env(env_key, token)
                      write_env("TRADINGAGENTS_LLM_PROVIDER", (tiers.get("quick") or {}).get("provider_type"))
                      write_env("TRADINGAGENTS_LLM_BACKEND_URL", (tiers.get("quick") or {}).get("base_url"))
                  else:
                      token = str(cfg.get("api_token") or "")
                      if token:
                          print(f"::add-mask::{token}")
                          env_key = str(cfg.get("provider_env_key") or "")
                          if env_key:
                              write_env(env_key, token)
                      write_env("TRADINGAGENTS_LLM_PROVIDER", cfg.get("provider_type"))
                      write_env("TRADINGAGENTS_DEEP_THINK_LLM", cfg.get("model_name"))
                      write_env("TRADINGAGENTS_QUICK_THINK_LLM", cfg.get("model_name"))
                      write_env("TRADINGAGENTS_LLM_BACKEND_URL", cfg.get("base_url"))

                  run_settings = cfg.get("run_settings") or {}
                  setting_env = {
                      "output_language": "TRADINGAGENTS_OUTPUT_LANGUAGE",
                      "max_debate_rounds": "TRADINGAGENTS_MAX_DEBATE_ROUNDS",
                      "max_risk_discuss_rounds": "TRADINGAGENTS_MAX_RISK_ROUNDS",
                      "max_tool_rounds": "TRADINGAGENTS_MAX_TOOL_ROUNDS",
                      "checkpoint_enabled": "TRADINGAGENTS_CHECKPOINT_ENABLED",
                      "temperature": "TRADINGAGENTS_TEMPERATURE",
                      "max_tokens": "TRADINGAGENTS_MAX_TOKENS",
                      "google_thinking_level": "TRADINGAGENTS_GOOGLE_THINKING_LEVEL",
                      "openai_reasoning_effort": "TRADINGAGENTS_OPENAI_REASONING_EFFORT",
                      "anthropic_effort": "TRADINGAGENTS_ANTHROPIC_EFFORT",
                      "holding_period_days": "TRADINGAGENTS_HOLDING_PERIOD_DAYS",
                      "benchmark_ticker": "TRADINGAGENTS_BENCHMARK_TICKER",
                  }
                  for key_name, env_name in setting_env.items():
                      if key_name in run_settings:
                          # An empty GITHUB_ENV value clears a workflow-level
                          # default and lets the provider choose its own default.
                          write_env(env_name, run_settings[key_name])
                  if "data_vendors" in run_settings:
                      write_env("TRADINGAGENTS_DATA_VENDORS_JSON", json.dumps(run_settings["data_vendors"], separators=(",", ":")))
                  portfolio = cfg.get("portfolio")
                  if portfolio:
                      packed = base64.b64encode(json.dumps(portfolio, separators=(",", ":")).encode("utf-8")).decode("ascii")
                      write_env("PORTFOLIO_JSON_B64", packed)
              except Exception as exc:
                  raise SystemExit(f"Failed to decrypt request model config: {exc}")
          PY

      - name: Validate unattended configuration
        run: |
          set -euo pipefail
          [[ -n "${TRADINGAGENTS_LLM_PROVIDER:-}" ]] || { echo "Missing active LLM provider."; exit 3; }
          [[ -n "${TRADINGAGENTS_DEEP_THINK_LLM:-}" ]] || { echo "Missing active deep-thinking model."; exit 3; }
          [[ -n "${TRADINGAGENTS_QUICK_THINK_LLM:-}" ]] || { echo "Missing active quick-thinking model."; exit 3; }
          [[ -n "${TRADINGAGENTS_LLM_BACKEND_URL:-}" ]] || { echo "Missing active model Base URL."; exit 3; }

      - name: Build and run agent command
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p .runtime/run

          PORTFOLIO_ARGS=()
          if [[ -n "${PORTFOLIO_JSON_B64:-}" ]]; then
            printf '%s' "$PORTFOLIO_JSON_B64" | base64 --decode > .runtime/run/portfolio.json
            PORTFOLIO_ARGS=(--portfolio .runtime/run/portfolio.json)
          fi

          CHECKPOINT_FLAG=(--no-checkpoint)
          if [[ "${TRADINGAGENTS_CHECKPOINT_ENABLED:-false}" == "true" ]]; then
            CHECKPOINT_FLAG=(--checkpoint)
          fi

          if [[ "$REQUEST_MODE" == "analysis" ]]; then
            [[ -n "$TICKER" ]] || { echo "Missing ticker."; exit 2; }
            [[ -n "$ANALYSIS_DATE" ]] || { echo "Missing analysis date."; exit 2; }
            CMD=(tradingagents --ticker "$TICKER" --date "$ANALYSIS_DATE" --analysts "${ANALYSTS:-${TRADINGAGENTS_DEFAULT_ANALYSTS}}" --save --no-show "${CHECKPOINT_FLAG[@]}" "${PORTFOLIO_ARGS[@]}")
          elif [[ "$REQUEST_MODE" == "backtest" ]]; then
            [[ -n "$TICKERS" ]] || { echo "Missing backtest tickers."; exit 2; }
            [[ -n "$START_DATE" && -n "$END_DATE" ]] || { echo "Missing backtest dates."; exit 2; }
            CMD=(tradingagents backtest "$TICKERS" --start "$START_DATE" --end "$END_DATE" --every "${EVERY:-7}" --asset-type "${ASSET_TYPE:-stock}" --analysts "${ANALYSTS:-${TRADINGAGENTS_DEFAULT_ANALYSTS}}" "${PORTFOLIO_ARGS[@]}")
          else
            echo "Unsupported mode: $REQUEST_MODE"
            exit 2
          fi

          printf '%q ' "${CMD[@]}" > .runtime/run/command.txt

          cat > .runtime/run/request.json <<EOF
          {
            "request_id": "${REQUEST_ID}",
            "mode": "${REQUEST_MODE}",
            "chat_id": "${REQUEST_CHAT_ID}",
            "ticker": "${TICKER}",
            "tickers": "${TICKERS}",
            "date": "${ANALYSIS_DATE}",
            "start": "${START_DATE}",
            "end": "${END_DATE}",
            "every": "${EVERY}",
            "analysts": "${ANALYSTS}"
          }
          EOF

          echo "Starting TradingAgents..."
          echo "Request ID: ${REQUEST_ID}"
          echo "Mode: ${REQUEST_MODE}"
          echo "Language: ${TRADINGAGENTS_OUTPUT_LANGUAGE}"

          # Follow the agents' conversation while it happens. The watcher opens
          # the checkpoint database the graph writes and only reads it, so the
          # run itself is untouched; when the chat is unreachable it gives up
          # quietly and the analysis goes on.
          watcher_pid=""
          if [[ "$REQUEST_MODE" == "analysis" && -n "${TELEGRAM_BOT_TOKEN:-}" && -n "${REQUEST_CHAT_ID:-}" ]]; then
            python live_stream.py \
              --cache-dir "${TRADINGAGENTS_CACHE_DIR}" \
              --ticker "${TICKER}" \
              --chat-id "${REQUEST_CHAT_ID}" \
              --request-id "${REQUEST_ID}" &
            watcher_pid=$!
            echo "Live stream watcher started (pid ${watcher_pid})."
          fi

          "${CMD[@]}" 2>&1 | tee .runtime/run/agent.log

          # Give the watcher a moment to publish the last messages.
          sleep 5
          if [[ -n "${watcher_pid}" ]]; then
            kill "${watcher_pid}" 2>/dev/null || true
            wait "${watcher_pid}" 2>/dev/null || true
          fi

      - name: Install report dependencies
        if: always()
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          sudo apt-get update || true
          sudo apt-get install -y fonts-noto-core fonts-noto-extra fonts-liberation fonts-dejavu-core || true
          python -m pip install --disable-pip-version-check markdown playwright
          python -m playwright install --with-deps chromium

      - name: Build clean PDF report
        if: always()
        continue-on-error: true
        env:
          REPORT_OUT_DIR: ${{ github.workspace }}/.runtime/results
        run: |
          set -uo pipefail
          mkdir -p .runtime/results

          # The report builder lives in the repository so it can be tested;
          # the inline script it replaces scraped every markdown file under
          # the home directory, which repeated each analyst's text three
          # times and matched the headline fields against unrelated prose.
          python report_builder.py

      - name: Save TradingAgents state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tradingagents-state
          path: .runtime/cache/
          retention-days: 90
          if-no-files-found: warn

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tradingagents-results-${{ github.run_id }}
          path: .runtime/results/
          retention-days: 90
          if-no-files-found: warn